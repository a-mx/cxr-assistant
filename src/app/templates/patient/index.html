{% extends "base.html" %}

{% block content %}
<h1>Patients</h1>

<p>
    <a href="{{ url_for('patient.new') }}">Add patient</a>
</p>

{% if patients %}
<table border="1" cellpadding="8">
    <thead>
        <tr>
            <th>Name</th>
            <th>Surname</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for patient in patients %}
        <tr>
            <td>{{ patient.name }}</td>
            <td>{{ patient.surname }}</td>
            <td>
                <a href="{{ url_for('analyze.submit', patient_id=patient.id) }}">
                    Create analysis
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>No patients found.</p>
{% endif %}
{% endblock %}
