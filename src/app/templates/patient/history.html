{% extends "base.html" %}

{% block content %}
{% if analyses %}
<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for a in analyses %}
        <tr>
            <td>{{ a.created_at.strftime("%Y-%m-%d %H:%M") }}</td>
            <td>
                <a href="{{ url_for('analyze.result', analysis_id=a.id) }}" class="action-button">
                    View
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>No analyses found.</p>
{% endif %}
{% endblock %}
